version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./careerpilot.db
      - SECRET_KEY=careerpilot-super-secret-key-change-in-production-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - LLM_PROVIDER=heuristic
      - DEMO_MODE=true
    volumes:
      - backend-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
